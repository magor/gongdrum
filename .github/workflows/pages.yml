name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'obrazky/**'
      - 'audio/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pr-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish built site to repository root
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
          rm -rf obrazky
          cp -r dist/obrazky obrazky
          rm -rf audio
          cp -r dist/audio audio
          rm -rf _optimized
          cp -r dist/_optimized _optimized
          cp dist/CNAME CNAME
          cp site/public/.nojekyll .nojekyll

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets obrazky audio _optimized CNAME .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore(pages): publish built site to repository root"
            git push
          fi

      - name: Deploy production site to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
          commit-message: chore(pages): deploy production site
